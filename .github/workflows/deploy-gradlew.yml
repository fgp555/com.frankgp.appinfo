name: Deploy AppInfo to Google Play

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create Service Account JSON from Secret
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_JSON" > app/play-service-account.json

      - name: Decode Release Keystore from Secret
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > app/release.keystore

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Publish to Google Play (internal track)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:publishReleaseBundle -PversionCode=$((RUN_NUMBER + 7))

      - name: Clean up secrets
        if: always()
        run: rm -f app/play-service-account.json app/release.keystore